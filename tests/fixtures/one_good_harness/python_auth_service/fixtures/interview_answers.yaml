session_id: one-good-harness-python-auth-service
answers:
  primary_goal: Keep a small Python auth service reliable while preserving proposal-only source changes.
  test_command: python -m pytest -q
  build_command: python -m py_compile src/auth_service.py
  change_policy: proposal_only
  forbidden_scope:
    - no automatic source patch apply
    - no secrets
    - no network calls
    - no package publish
  allowed_scope:
    - read fixture files
    - create Cambrian harness artifacts
    - record validation evidence
  important_paths:
    - src/auth_service.py
    - tests/test_auth_service.py
    - pyproject.toml
  validation_standard: Pytest passes and source files remain unchanged unless an explicit apply step is requested.
  agent_roles:
    - auth-domain-investigator: Inspect auth normalization behavior and cite code evidence.
    - pytest-regression-guardian: Own pytest command selection and regression risk.
    - proposal-safety-reviewer: Keep source changes proposal-only and block unsafe scope.
    - harness-replay-auditor: Verify replay artifacts, receipt hashes, and proof boundaries.
